<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد GOEIC الصوتي</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
        }

        #container {
            width: 90%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
            padding: 24px;
            text-align: center;
        }

        h1 {
            color: #1a535c;
        }

        #recordButton {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(255, 107, 107, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #recordButton.recording {
            background-color: #1a535c;
            box-shadow: 0 4px 8px rgba(26, 83, 92, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #status {
            font-size: 1.1em;
            color: #495057;
            margin-top: 20px;
            min-height: 50px;
        }

        #transcript, #answer {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            text-align: right;
            border: 1px solid #e9ecef;
        }

        strong {
            color: #1a535c;
        }

        #loading {
            display: none;
            margin-top: 10px;
            font-size: 1em;
            color: #1a535c;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>المساعد الصوتي</h1>
        <button id="recordButton" title="اضغط للتسجيل">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-mic-fill" viewBox="0 0 16 16">
                <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0V3z"/>
                <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"/>
            </svg>
        </button>
        <div id="status">اضغط على المايك وابدأ الكلام...</div>
        <div id="loading">⏳ جاري المعالجة...</div>
        <div id="transcript" style="display:none;"></div>
        <div id="answer" style="display:none;"></div>
    </div>

    <script>
        const recordButton = document.getElementById('recordButton');
        const statusDisplay = document.getElementById('status');
        const transcriptDisplay = document.getElementById('transcript');
        const answerDisplay = document.getElementById('answer');
        const loadingDisplay = document.getElementById('loading');
        let audioContext; // <-- 1. 

        const WEBSOCKET_URL = "ws://127.0.0.1:8000/ws/voice";

        let websocket;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordButton.onclick = () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        };

        function startRecording() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    // --- 2.   ---
                    if (!audioContext) {
                        //     AudioContext 
                        // Cross-browser compatibility
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        audioContext = new AudioContext();
                    }
                    //      
                    //       Safari   
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(() => {
                            console.log("AudioContext resumed!");
                        });
                    }
                    // ---   ---

                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();

                    isRecording = true;
                    recordButton.classList.add('recording');
                    recordButton.title = "اضغط للإيقاف";
                    statusDisplay.textContent = "🎙️ يسجل الآن... اضغط للإيقاف.";
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = sendAudioData;
                })
                .catch(e => {
                    console.error("Error getting media:", e);
                    statusDisplay.textContent = "حدث خطأ: لا يمكن الوصول للمايكروفون.";
                });
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                isRecording = false;
                recordButton.classList.remove('recording');
                recordButton.title = "اضغط للتسجيل";
                statusDisplay.textContent = "جاري إرسال الصوت... برجاء الانتظار.";
                loadingDisplay.style.display = 'block';
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }

        function sendAudioData() {
            //  webm  wav 
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); // 

            if (audioBlob.size < 1000) {
                statusDisplay.textContent = "لم يتم تسجيل صوت. اضغط مرة أخرى.";
                loadingDisplay.style.display = 'none';
                return;
            }

            connectWebSocket(audioBlob);
        }

function connectWebSocket(audioBlob) {
    transcriptDisplay.style.display = 'none';
    answerDisplay.style.display = 'none';

    websocket = new WebSocket(WEBSOCKET_URL);

    websocket.onopen = () => {
        console.log("WebSocket connected. Sending audio...");
        websocket.send(audioBlob);
    };

    websocket.onmessage = event => {
        const data = JSON.parse(event.data);
        loadingDisplay.style.display = 'none';

        if (data.error) {
            console.error("Server error:", data.error);
            statusDisplay.textContent = `⚠️ خطأ من السيرفر: ${data.error}`;
            return;
        }

        if (data.type === "full_response") {
            transcriptDisplay.innerHTML = `<strong>🗣️ أنت قلت:</strong> ${data.transcript}`;
            transcriptDisplay.style.display = 'block';
            answerDisplay.innerHTML = `<strong>🤖 المساعد:</strong> ${data.answer}`;
            answerDisplay.style.display = 'block';
            statusDisplay.textContent = "🔊 المساعد يتحدث...";
        } 
        else if (data.type === "audio_chunk" && data.audio) {
            playAudio(data.audio)
                .then(() => console.log("🎧 تم تشغيل جزء الصوت."))
                .catch(err => console.error("فشل تشغيل الصوت:", err));
        } 
        else if (data.type === "stream_end") {
            statusDisplay.textContent = "✅ انتهى المساعد من التحدث. يمكنك التحدث من جديد.";
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.close();
            }
        }
    };

    websocket.onclose = () => {
        console.log("WebSocket closed.");
        loadingDisplay.style.display = 'none';
    };

    websocket.onerror = error => {
        console.error("WebSocket error:", error);
        statusDisplay.textContent = "⚠️ خطأ في الاتصال بالسيرفر. تأكد أن السيرفر يعمل.";
        loadingDisplay.style.display = 'none';
    };
}

        function playAudio(base64String) {
            return new Promise((resolve, reject) => {
                try {
                    const audioBytes = Uint8Array.from(atob(base64String), c => c.charCodeAt(0));
                    const audioBlob = new Blob([audioBytes], { type: 'audio/mp3' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);

                    audio.play()
                        .then(() => {
                             console.log("Audio playback started successfully.");
                             resolve(); // 
                        })
                        .catch(error => {
                             console.error("Audio playback failed:", error);
                             reject(error); // 
                        });
                    //    URL  
                    audio.onended = () => {
                        URL.revokeObjectURL(audioUrl);
                        console.log("Audio URL revoked.");
                    };
                 } catch (e) {
                     console.error("Error decoding or creating audio:", e);
                     reject(e); //  Decoding 
                 }
            });
        }
        // ---   ---
    </script>
</body>
</html>
